<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — AI Command Center</title><link rel="stylesheet" href="/app.css"><style>body{display:grid;min-height:100vh;place-items:center;margin:0;background:#0d1527;color:#f6f8ff;font-family:system-ui,sans-serif}.login{max-width:390px;width:calc(100% - 48px);background:#18233b;border:1px solid #32415c;border-radius:16px;padding:28px}.login label{display:block;margin:14px 0 6px}.login input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #71809d;background:#f5f7ff;color:#152033;font-size:16px}.login button{width:100%;padding:12px;margin-top:22px;border-radius:8px;cursor:pointer}#error{color:#ffb0b0;min-height:1.5em}</style></head><body><main class="login"><h1>AI Command Center</h1><p>Đăng nhập quản trị</p><form id="loginForm"><label for="username">Tài khoản</label><input id="username" autocomplete="username" required value="admin"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Đăng nhập</button></form><p id="error" role="alert"></p></main><script src="/login.js"></script></body></html>
